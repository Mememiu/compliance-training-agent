<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>培训室 · Learning Score banner</title>
    <style>
      :root {
        --ink: #182126;
        --ink-deep: #0f1518;
        --paper: #fcfbf7;
        --paper-ground: #f5f2ea;
        --steel: #b9c6cc;
        --rule: #34434a;
        --lime: #d9e45f;
        --lime-deep: #aab52f;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ink-deep);
        color: var(--paper);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .banner {
        position: relative;
        width: 1920px;
        height: 640px;
        overflow: hidden;
        background: var(--ink-deep);
      }

      .banner::before,
      .banner::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: rgb(185 198 204 / 0.24);
      }

      .banner::before { top: 72px; }
      .banner::after { bottom: 72px; }

      .safe-zone {
        position: absolute;
        inset: 96px 132px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .copy { width: 820px; }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
        color: var(--steel);
        font: 500 18px/1.4 "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0;
      }

      .eyebrow-mark {
        width: 52px;
        height: 8px;
        background: var(--lime);
        box-shadow: 20px 0 0 var(--paper);
      }

      h1 {
        margin: 0;
        color: var(--paper);
        font-size: 76px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: 0;
      }

      .lede {
        max-width: 660px;
        margin: 28px 0 0;
        color: var(--steel);
        font-size: 25px;
        line-height: 1.6;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 42px;
        color: var(--paper);
        font-size: 17px;
      }

      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .meta span::before {
        content: "";
        width: 8px;
        height: 8px;
        background: var(--lime);
      }

      .notation {
        position: relative;
        width: 650px;
        height: 430px;
        border: 1px solid var(--rule);
        background: var(--ink);
      }

      .notation::before,
      .notation::after {
        content: "";
        position: absolute;
        left: 48px;
        right: 48px;
        height: 1px;
        background: rgb(185 198 204 / 0.2);
      }

      .notation::before { top: 116px; }
      .notation::after { bottom: 116px; }

      .axis {
        position: absolute;
        top: 44px;
        bottom: 44px;
        left: 326px;
        width: 2px;
        background: rgb(185 198 204 / 0.42);
      }

      .beat {
        position: absolute;
        height: 20px;
        background: var(--steel);
      }

      .beat:nth-of-type(1) { top: 74px; left: 132px; width: 154px; }
      .beat:nth-of-type(2) { top: 136px; left: 356px; width: 190px; }
      .beat:nth-of-type(3) { top: 198px; left: 86px; width: 176px; background: var(--paper); }
      .beat:nth-of-type(4) { top: 260px; left: 356px; width: 130px; }
      .beat:nth-of-type(5) { top: 322px; left: 150px; width: 220px; }

      .beat.current {
        top: 198px;
        left: 356px;
        width: 224px;
        height: 28px;
        background: var(--lime);
        box-shadow: 0 0 0 8px rgb(217 228 95 / 0.12);
      }

      .notation-label {
        position: absolute;
        right: 44px;
        bottom: 28px;
        color: var(--steel);
        font: 500 16px/1.4 "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      }

      .registration {
        position: absolute;
        top: 32px;
        right: 42px;
        width: 18px;
        height: 18px;
        border: 1px solid var(--lime);
      }

      .registration::after {
        content: "";
        position: absolute;
        top: 8px;
        left: -10px;
        width: 36px;
        height: 1px;
        background: var(--lime);
      }

      .mark {
        position: absolute;
        right: 58px;
        bottom: 42px;
        width: 74px;
        height: 74px;
      }

      .mark img { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <main class="banner" aria-label="培训室品牌横幅">
      <div class="safe-zone">
        <section class="copy">
          <div class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span>LEARNING SCORE / 01</div>
          <h1>培训室</h1>
          <p class="lede">把公司的知识，变成每个人都能跟随的学习路径。</p>
          <div class="meta">
            <span>课程</span>
            <span>场景</span>
            <span>进度</span>
          </div>
        </section>
        <section class="notation" aria-label="学习谱路径记号">
          <span class="axis" aria-hidden="true"></span>
          <span class="beat" aria-hidden="true"></span>
          <span class="beat" aria-hidden="true"></span>
          <span class="beat" aria-hidden="true"></span>
          <span class="beat" aria-hidden="true"></span>
          <span class="beat" aria-hidden="true"></span>
          <span class="beat current" aria-hidden="true"></span>
          <span class="registration" aria-hidden="true"></span>
          <span class="notation-label">CURRENT STEP / 03</span>
          <div class="mark"><img src="/brand/learning-score-mark-light.svg" alt="Learning Score mark" /></div>
        </section>
      </div>
    </main>
  </body>
</html>
